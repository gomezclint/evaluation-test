name: Compare judge vs human
on:
  workflow_run:
    workflows: ["Daily export"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Date to compare (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  issues: write          # lets the alert check open, comment on, and close issues

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: daily-exports
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python compare.py
        env:
          RUN_DATE: ${{ github.event.inputs.date }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'daily' }}
      - name: Check alerts
        if: github.event_name != 'workflow_dispatch'   # daily runs only
        working-directory: .
        run: python analysis/check_alerts.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run SQL analysis
        if: github.event_name != 'workflow_dispatch'   # daily runs only
        working-directory: .
        run: python analysis/run_queries.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparisons/ ../analysis/
          git diff --cached --quiet && exit 0
          git commit -m "Judge comparison $(date -u +%F)"
          git pull --rebase
          git push
