name: Prompt regression test
on:
  push:
    paths:
      - "prompt-management/prompts/candidate_prompt.md"
      - "prompt-management/prompts/style_guide_de.md"
      - "prompt-management/golden/**"
      - "prompt-management/eval_config.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prompt-management
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - name: Test candidate prompt (promotes it if every check passes)
        run: python regression_test.py --promote
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "Prompt regression test $(date -u +%F)"
          git pull --rebase
          git push
