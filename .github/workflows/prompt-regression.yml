name: Prompt regression test
on:
  push:
    paths:
      - "prompts/candidate_prompt.md"
      - "prompts/style_guide_de.md"
      - "golden/**"
      - "eval_config.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test candidate prompt (promotes it if every check passes)
        run: python eval_prompt.py --promote
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval_results/ prompts/
          git diff --cached --quiet && exit 0
          git commit -m "Prompt regression test $(date -u +%F)"
          git pull --rebase
          git push
